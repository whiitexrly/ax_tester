[project]
name = "ax-tester"
version = "0.1.0"
description = "Accessibility Tester"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "google-adk==1.24.1",
  "litellm==1.81.10",
  "playwright==1.58.0",
  "beautifulsoup4==4.14.3",
  "cairosvg==2.8.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "common*", "tools*", "utils*", "schemas*"]
